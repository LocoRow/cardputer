; Proyecto 1: escáner WiFi — M5Stack Cardputer ADV (ESP32-S3 / Stamp-S3A)
;
; board = m5stack-stamps3: no hay definición oficial "cardputer" en
; PlatformIO; el Cardputer (base y ADV) está construido sobre el módulo
; M5Stamp-S3A, así que se usa esa placa + los flags de USB nativo (el
; ESP32-S3 no lleva chip USB-serie aparte; Serial va por CDC nativo).
;
; board_build.arduino.memory_type = qio_opi: la ADV lleva 8 MB de PSRAM
; octal (OPI). Sin esto arranca igual pero no vería esa RAM. Si algo no
; arranca bien, lo primero a revisar es este flag.

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    m5stack/M5Cardputer @ ^1.1.1
    marian-craciunescu/ESP32Ping @ ^1.7
    knolleary/PubSubClient @ ^2.8
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
